[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-db"
version = "0.1.0"
description = "Natural Language to SQLite Database Application"
authors = [{name = "Antigravity", email = "antigravity@gemini.local"}]
dependencies = [
    "PySide6>=6.7",
    "requests>=2.31",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["app"]
